name: pdfrx
description: pdfrx is a rich and fast PDF viewer and manipulation plugin built on the top of PDFium. Supports viewing, editing, combining PDFs on Android, iOS, Windows, macOS, Linux, and Web.
version: 2.3.3
publish_to: none
homepage: https://github.com/espresso3389/pdfrx
repository: https://github.com/espresso3389/pdfrx/tree/master/packages/pdfrx
issue_tracker: https://github.com/espresso3389/pdfrx/issues
screenshots:
  - description: 'Viewer example on Web'
    path: screenshot.jpg

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  pdfrx_engine: 
    git: https://github.com/kumsumit/pdfrx_engine.git
  pdfium_flutter:
    git: https://github.com/kumsumit/pdfium_flutter.git
  collection: ^1.19.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  path: ^1.9.1
  path_provider:
    git: https://github.com/kumsumit/path_provider.git
  rxdart: ^0.28.0
  synchronized: ^3.4.0
  url_launcher:
    git: https://github.com/kumsumit/url_launcher.git
  vector_math: ^2.2.0
  web: ^1.1.1
  yaml: ^3.1.3

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  archive: ^4.0.9

executables:
  remove_wasm_modules:
  remove_darwin_pdfium_modules:

flutter:
  assets:
    - assets/
